<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#888}iframe{border:0;display:block}</style>
<pre id="out">pending</pre>
<script>
const q=new URLSearchParams(location.search),W=+q.get('w'),H=+q.get('h'),kit=q.get('kit')||'home',y=+(q.get('y')||0),shot=q.has('shot');
const f=document.createElement('iframe');f.style.width=W+'px';f.style.height=H+'px';f.src='/?kit='+kit;
if(shot)document.body.prepend(f);else document.body.append(f);
if(shot)document.getElementById('out').style.display='none';
f.onload=()=>setTimeout(()=>{const d=f.contentDocument,w=f.contentWindow;
 if(y)w.scrollTo(0,y);
 setTimeout(()=>{
 const R=e=>{const b=e.getBoundingClientRect();return{t:Math.round(b.top),l:Math.round(b.left),r:Math.round(b.right),b:Math.round(b.bottom),w:Math.round(b.width),h:Math.round(b.height)}};
 const o={vw:w.innerWidth,cw:d.documentElement.clientWidth,sw:d.documentElement.scrollWidth,bsw:d.body.scrollWidth,docH:d.documentElement.scrollHeight};
 const strip=d.querySelector('.strip'),nav=strip.querySelector('nav');
 o.strip=R(strip);o.club=R(strip.querySelector('.club'));o.nav=Object.assign(R(nav),{cw:nav.clientWidth,sw:nav.scrollWidth,ox:getComputedStyle(nav).overflowX,snap:getComputedStyle(nav).scrollSnapType});
 o.links=[...nav.querySelectorAll('a')].map(a=>Object.assign(R(a),{x:a.textContent.trim(),ol:a.offsetLeft,ow:a.offsetWidth}));
 nav.scrollLeft=99999;o.navMax=nav.scrollLeft;o.linksEnd=[...nav.querySelectorAll('a')].map(a=>Object.assign(R(a),{x:a.textContent.trim()}));nav.scrollLeft=0;
 o.btns=[...d.querySelectorAll('.acts .btn')].map(R);o.acts=R(d.querySelector('.acts'));
 o.stage=R(d.getElementById('card-stage'));o.copy=R(d.querySelector('.copy'));o.kitw=R(d.querySelector('.kitw'));o.h1=R(d.querySelector('h1'));o.patch=R(d.querySelector('.patch'));o.lede=R(d.querySelector('.lede'));
 o.flip=R(d.getElementById('flip'));o.canvas=d.querySelector('#card-stage canvas')?R(d.querySelector('#card-stage canvas')):null;
 o.wide=[...d.querySelectorAll('body *')].filter(e=>{const b=e.getBoundingClientRect();return b.width&&(b.right>w.innerWidth+.5||b.left<-.5)&&!e.closest('.strip nav')&&!e.matches('.sr,.sr *,.skip')}).map(e=>e.tagName+'.'+e.className+'#'+e.id+' '+JSON.stringify(R(e))).slice(0,30);
 o.order=[...d.querySelector('.record').children].map(s=>s.id+':pt='+getComputedStyle(s).paddingTop);
 o.kit=d.documentElement.dataset.kit;
 document.getElementById('out').textContent=JSON.stringify(o,null,1);
 },600)},2500);
</script>

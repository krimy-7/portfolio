<!doctype html><meta charset="utf-8"><body style="margin:0">
<pre id="out"></pre>
<script>
const P=new URLSearchParams(location.search),W=+P.get("w")||1280,H=+P.get("h")||900,kit=P.get("kit")||"home";
const f=document.createElement("iframe");f.style.cssText=`width:${W}px;height:${H}px;border:0`;f.src="/?kit="+kit;document.body.prepend(f);
const out=[],log=s=>out.push(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{
  const w=f.contentWindow,d=f.contentDocument;await wait(600);
  const cur=()=>[...d.querySelectorAll(".strip nav a[aria-current]")].map(a=>a.getAttribute("href")+"="+a.getAttribute("aria-current")).join(",")||"none";
  const order=[...d.querySelectorAll(".record > section")].map(s=>s.id).join(">");
  log(`kit=${kit} ${W}x${H} recordOrder=${order} top: ${cur()} navScrollW=${d.querySelector(".strip nav").scrollWidth} clientW=${d.querySelector(".strip nav").clientWidth}`);
  const ids=["about","experience","projects","education","skills","contact"];
  const sorted=ids.map(i=>d.getElementById(i)).sort((a,b)=>a.compareDocumentPosition(b)&4?-1:1);
  for(const s of sorted){
    const top=s.getBoundingClientRect().top+w.scrollY;
    for(const [lbl,y] of [["head",top-72],["mid",top+s.offsetHeight/2-H/2],["tail",top+s.offsetHeight-H*0.6]]){
      w.scrollTo({top:y,behavior:"instant"});await wait(250);
      log(`${s.id}.${lbl} y=${Math.round(w.scrollY)} -> ${cur()} navScrollLeft=${Math.round(d.querySelector(".strip nav").scrollLeft)}`);
    }
  }
  w.scrollTo({top:1e6,behavior:"instant"});await wait(250);log(`bottom y=${Math.round(w.scrollY)} -> ${cur()}`);
  w.scrollTo({top:0,behavior:"instant"});await wait(250);log(`back-top -> ${cur()}`);
  // hash nav: click each nav link
  for(const a of d.querySelectorAll('.strip nav a[href^="#"]')){a.click();await wait(1200);log(`click ${a.getAttribute("href")} y=${Math.round(w.scrollY)} -> ${cur()}`)}
  document.getElementById("out").textContent=out.join("\n");
};
</script>
